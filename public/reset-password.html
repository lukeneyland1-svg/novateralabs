<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – NovaTeraLabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" style="display:flex;align-items:center;justify-content:center;min-height:90vh;">
  <div class="panel" style="width:100%;max-width:360px;">
    <div class="panel-head"><h2>Choose a new password</h2></div>
    <form id="resetForm">
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:14px;">
        New password
        <input type="password" id="password" required minlength="8" style="display:block;width:100%;margin-top:7px;background:var(--panel-alt);border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;">
      </label>
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:14px;">
        Confirm password
        <input type="password" id="confirmPassword" required minlength="8" style="display:block;width:100%;margin-top:7px;background:var(--panel-alt);border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;">
      </label>
      <div id="formMessage" style="display:none;font-size:12px;margin:-8px 0 14px;font-family:'IBM Plex Mono',monospace;"></div>
      <button type="submit" class="btn primary" id="submitBtn" style="width:100%;justify-content:center;">Set new password</button>
    </form>
    <p style="margin:16px 0 0;text-align:center;"><a href="login.html" style="color:var(--text-dim);font-size:12.5px;">Back to sign in</a></p>
  </div>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token');
const form = document.getElementById('resetForm');
const msg = document.getElementById('formMessage');

if (!token) {
  form.style.display = 'none';
  msg.style.color = 'var(--crit)';
  msg.textContent = 'This reset link is missing its token. Please request a new one.';
  msg.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('submitBtn');

  if (password !== confirmPassword) {
    msg.style.color = 'var(--crit)';
    msg.textContent = "Passwords don't match.";
    msg.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');

    msg.style.color = 'var(--accent)';
    msg.textContent = 'Password updated. You can now sign in.';
    msg.style.display = 'block';
    form.style.display = 'none';
  } catch (err) {
    msg.style.color = 'var(--crit)';
    msg.textContent = err.message;
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Set new password';
  }
});
</script>
</body>
</html>
