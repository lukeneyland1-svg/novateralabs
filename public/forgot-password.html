<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script src="theme-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password – NovaTeraLabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" style="display:flex;align-items:center;justify-content:center;min-height:90vh;">
  <div class="panel" style="width:100%;max-width:360px;">
    <div class="panel-head"><h2>Reset your password</h2></div>
    <p style="color:var(--text-muted);font-size:13.5px;margin:-8px 0 20px;">Enter the email on your account and we'll send you a reset link.</p>
    <form id="forgotForm">
      <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:14px;">
        Email
        <input type="email" id="email" required style="display:block;width:100%;margin-top:7px;background:var(--panel-alt);border:1px solid var(--line);border-radius:8px;padding:10px 11px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;">
      </label>
      <div id="formMessage" style="display:none;font-size:12px;margin:-8px 0 14px;font-family:'IBM Plex Mono',monospace;"></div>
      <button type="submit" class="btn primary" id="submitBtn" style="width:100%;justify-content:center;">Send reset link</button>
    </form>
    <p style="margin:16px 0 0;text-align:center;"><a href="login.html" style="color:var(--text-dim);font-size:12.5px;">Back to sign in</a></p>
  </div>
</div>
<script src="forgot-password.js"></script>
</body>
</html>
